services:
  # Web Service - API + Bot
  - type: web
    name: sendvpn-api
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: MODE
        value: all
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sendvpn-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: PARSER_INTERVAL
        value: 3600
    healthCheckPath: /health

databases:
  - name: sendvpn-db
    databaseName: sendvpn
    user: sendvpn
    plan: free
    region: frankfurt
