version: '3.8'

services:
  sendvpn:
    build: .
    container_name: sendvpn
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Europe/Moscow
    networks:
      - sendvpn_network

  # PostgreSQL (опционально, вместо SQLite)
