  #     POSTGRES_PASSWORD: your_password_here
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - sendvpn_network

  # Redis (опционально, для кеширования)
  # redis:
  #   image: redis:7-alpine
  #   container_name: sendvpn_redis
  #   restart: unless-stopped
  #   networks:
  #     - sendvpn_network

networks:
  sendvpn_network:
    driver: bridge

